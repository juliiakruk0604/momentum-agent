name: Alpha breakout watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-breakout-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out alert branch
        uses: actions/checkout@v4
        with:
          ref: alpha-alerts
          fetch-depth: 1

      - name: Check PALU and BNBHOLDER
        run: python alpha_breakout_watch.py --state alpha_alerts/state.json --output alpha_alerts/latest.json

      - name: Publish a new confirmed signal
        shell: bash
        run: |
          if git diff --quiet -- alpha_alerts/state.json alpha_alerts/latest.json; then
            echo "No new confirmed signal"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alpha_alerts/state.json alpha_alerts/latest.json
          git commit -m "alpha signal: confirmed breakout"
          git push origin HEAD:alpha-alerts
